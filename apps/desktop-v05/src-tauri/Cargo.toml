[package]
name = "tg-content-toolbox-v05"
version = "0.5.3"
description = "TG Content Toolbox v0.5 for Windows"
authors = ["WJL"]
edition = "2021"

[lib]
name = "tg_content_toolbox_v05_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate"] }
getrandom = "0.2"
base64 = "0.22"
grammers-client = { version = "0.10", features = ["proxy"] }
grammers-mtsender = { version = "0.10", features = ["proxy"] }
grammers-session = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }

[dev-dependencies]
tempfile = "3"
